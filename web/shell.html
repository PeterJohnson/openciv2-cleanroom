<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenCiv2</title>
  <link rel="icon" href="data:,">
  <style>
    body { margin: 0; background: #0f1d24; color: #e5ebe2; font: 16px system-ui, sans-serif; }
    main { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
    h1 { font-size: 1.2rem; font-weight: 600; }
    canvas { width: 100%; height: auto; display: block; aspect-ratio: 3 / 2; outline: 1px solid #374f52; touch-action: none; }
    canvas:focus-visible { outline: 2px solid #cdb169; }
    p { color: #99aea8; }
    button { font: inherit; padding: .4rem .8rem; }
  </style>
</head>
<body>
  <main>
    <h1>OpenCiv2</h1>
    <p id="status" role="status">Loading...</p>
    <canvas id="canvas" width="960" height="640" tabindex="0" aria-label="OpenCiv2 game. Use Tab and Enter to select, Escape to cancel, F10 then Down for menus."></canvas>
    <p>Click the game to focus. F10 then Down opens menus. Tab and Enter select; Escape cancels.</p>
    <button type="button" onclick="location.reload()">Restart</button>
  </main>
  <script>
    const canvas = document.getElementById('canvas');
    const status = document.getElementById('status');
    canvas.addEventListener('pointerdown', () => canvas.focus());
    canvas.addEventListener('contextmenu', event => event.preventDefault());
    var Module = {
      canvas,
      print: console.log,
      printErr: console.error,
      setStatus: text => { if (text) status.textContent = text; },
      onRuntimeInitialized: () => { status.textContent = 'Ready'; canvas.focus(); },
      onExit: code => { status.textContent = code === 0 ? 'Session ended. Select Restart to play again.' : 'The game stopped with an error.'; },
      onAbort: () => { status.textContent = 'Unable to start the game. See the browser console for details.'; }
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
