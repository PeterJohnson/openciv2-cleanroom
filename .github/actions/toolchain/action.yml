name: Pinned build tools
description: Install CMake and select the compiler baseline from dependencies.json
outputs:
  emsdk:
    description: Pinned Emscripten SDK version
    value: ${{ steps.pins.outputs.emsdk }}
  playwright:
    description: Pinned browser test library version
    value: ${{ steps.pins.outputs.playwright }}
inputs:
  web:
    description: Skip native compiler selection for Emscripten
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - id: pins
      shell: python
      run: |
        import json, os, sys
        pins = json.load(open('dependencies.json'))
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            for key in ('cmake', 'emsdk', 'playwright'):
                print(f"{key}={pins['tools'][key]}", file=output)
            platform = {'linux': 'linux', 'win32': 'windows', 'darwin': 'macos'}[sys.platform]
            print('llvm=' + pins['toolchains'][platform]['compilerVersion'], file=output)
        if sys.platform == 'darwin':
            xcode = pins['toolchains']['macos']['xcode']
            with open(os.environ['GITHUB_ENV'], 'a') as output:
                print(f'DEVELOPER_DIR=/Applications/Xcode_{xcode}.app/Contents/Developer', file=output)
    - uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: ${{ steps.pins.outputs.cmake }}
    - uses: KyleMayes/install-llvm-action@v2
      if: runner.os != 'macOS' && inputs.web != 'true'
      with:
        version: ${{ steps.pins.outputs.llvm }}
        directory: ${{ runner.temp }}/oc2-llvm
    - name: Install macOS LLVM for the module experiment
      if: runner.os == 'macOS' && inputs.web != 'true'
      shell: bash
      run: |
        version='${{ steps.pins.outputs.llvm }}'
        formula="llvm@${version%%.*}"
        brew install "$formula"
        llvm_path="$(brew --prefix "$formula")"
        echo "LLVM_PATH=$llvm_path" >> "$GITHUB_ENV"
        echo "$llvm_path/bin" >> "$GITHUB_PATH"
