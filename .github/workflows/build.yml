name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  metadata-and-formatting:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
        include:
          - os: ubuntu-24.04
            container: ubuntu:26.04
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Prepare Ubuntu container
        if: matrix.container != ''
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl g++ git ninja-build python3 xz-utils libtinfo6 zlib1g
      - uses: actions/checkout@v4
      - name: Trust the checked-out container workspace
        if: matrix.container != ''
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned formatter
        run: >-
          python -c "import json, subprocess, sys;
          version = json.load(open('dependencies.json'))['tools']['clang-format'];
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', 'clang-format==' + version])"
      - run: python tools/format.py --check
      - run: python tools/check_conformance.py
      - run: python tools/check_assets.py
      - name: Install pinned content schema validator
        run: python -m pip install -r tools/requirements-schemas.txt
      - run: python tools/check_content_schemas.py
      - run: python tools/check_gameplay.py
      - name: Test metadata, content schemas, staged-file handling and commit hook
        run: python -m unittest discover -s tests -p "test_*.py" -v

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
        mode: [desktop, headless]
        include:
          - os: ubuntu-24.04
            container: ubuntu:26.04
          - os: windows-2022
            mode: headless-sqlite-off
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Prepare Ubuntu container
        if: matrix.container != ''
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl g++ git ninja-build python3 sudo xz-utils libtinfo6 zlib1g
      - uses: actions/checkout@v4
      - name: Trust the checked-out container workspace
        if: matrix.container != ''
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: ./.github/actions/toolchain
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Linux GUI build dependencies
        if: runner.os == 'Linux' && matrix.mode == 'desktop'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev libdecor-0-dev libasound2-dev libpulse-dev libegl1-mesa-dev libgl1-mesa-dev
      - name: Configure pinned toolchain
        shell: bash
        run: |
          args=(-DOC2_VERIFY_TOOLCHAIN=ON -DOC2_FETCH_DEPENDENCIES=ON -DCMAKE_BUILD_TYPE=Debug)
          if [ "${{ matrix.mode }}" = desktop ]; then
            args+=(-DOC2_FETCH_SDL=ON -DOC2_GUI_TESTS=ON)
          else
            args+=(-DOC2_BUILD_GUI=OFF)
            if [ "${{ matrix.mode }}" = headless-sqlite-off ]; then
              args+=(-DOC2_ENABLE_SQLITE_EXPORT=OFF)
            else
              args+=(-DOC2_ENABLE_SQLITE_EXPORT=ON)
            fi
          fi
          if [ "$RUNNER_OS" = Windows ]; then
            args+=(-G Ninja "-DCMAKE_C_COMPILER=$LLVM_PATH/bin/clang-cl.exe" "-DCMAKE_CXX_COMPILER=$LLVM_PATH/bin/clang-cl.exe")
          elif [ "$RUNNER_OS" = macOS ]; then
            args+=(-G Ninja "-DCMAKE_C_COMPILER=$LLVM_PATH/bin/clang" "-DCMAKE_CXX_COMPILER=$LLVM_PATH/bin/clang++"
              "-DCMAKE_OBJC_COMPILER=$LLVM_PATH/bin/clang" "-DCMAKE_OBJCXX_COMPILER=$LLVM_PATH/bin/clang++"
              "-DCMAKE_OSX_SYSROOT=$(xcrun --show-sdk-path)")
          else
            args+=(-G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++)
          fi
          cmake -S . -B build/ci "${args[@]}"
      - run: cmake --build build/ci --config Debug --parallel 4
      - run: ctest --test-dir build/ci -C Debug --output-on-failure --output-junit test-results.xml
      - name: Tools-only build without Python discovery or runtime assets
        if: runner.os == 'Linux' && matrix.mode == 'headless'
        run: |
          cmake -S . -B build/tools-only -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DOC2_VERIFY_TOOLCHAIN=ON -DOC2_BUILD_GUI=OFF -DBUILD_TESTING=OFF -DOC2_BUILD_TOOLS=ON -DOC2_ENABLE_SQLITE_EXPORT=OFF -DOC2_FETCH_DEPENDENCIES=OFF -DCMAKE_DISABLE_FIND_PACKAGE_Python3=ON
          cmake --build build/tools-only --parallel 4
          python tests/inspection_cli.py build/tools-only/oc2 build/ci/oc2_save_roundtrip
          python tests/content_cli.py build/tools-only/oc2
      - name: Build identities and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openciv2-${{ matrix.os }}-${{ matrix.mode }}
          path: |
            build/ci/build-identity.txt
            build/ci/test-results.xml
            build/ci/conformance-results.json
            build/ci/Testing/Temporary/LastTest.log
            build/ci/gui-results/
            build/tools-only/build-identity.txt
          if-no-files-found: ignore

  sanitizers:
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Prepare Ubuntu container
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl g++ git ninja-build python3 xz-utils libtinfo6 zlib1g
      - uses: actions/checkout@v4
      - name: Trust the checked-out container workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: ./.github/actions/toolchain
      - run: cmake --preset sanitize -DOC2_FETCH_DEPENDENCIES=ON -DOC2_VERIFY_TOOLCHAIN=ON -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
      - run: cmake --build --preset sanitize --parallel 4
      - run: ctest --preset sanitize --output-junit test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openciv2-sanitizers
          path: |
            build/sanitize/build-identity.txt
            build/sanitize/test-results.xml
            build/sanitize/conformance-results.json
            build/sanitize/Testing/Temporary/LastTest.log

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain
        id: pins
        with:
          web: 'true'
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ steps.pins.outputs.emsdk }}
          actions-cache-folder: emsdk-cache
      - run: cmake --preset web -DOC2_VERIFY_TOOLCHAIN=ON
      - run: cmake --build build/web --parallel 4
      - run: ctest --preset web --output-junit test-results.xml
      - name: Browser test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@${{ steps.pins.outputs.playwright }}
          npx playwright install --with-deps chromium
      - run: node tests/web_smoke.cjs build/web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openciv2-web
          path: |
            build/web/openciv2.html
            build/web/openciv2.js
            build/web/openciv2.wasm
            build/web/THIRD_PARTY_NOTICES.txt
            build/web/build-identity.txt
            build/web/test-results.xml
            build/web/conformance-results.json
            build/web/Testing/Temporary/LastTest.log
