name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  coverage:
    name: Implementation coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python tools/dotnet/check_coverage.py
      - run: python tools/dotnet/test_coverage.py

  native:
    name: Core, CLI and packages (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python tools/dotnet/test_identity.py
      - run: python tools/dotnet/test_publish_notices.py
      - run: dotnet restore OpenCiv2.slnx --locked-mode
      - run: dotnet build OpenCiv2.slnx -c Release --no-restore
      - run: dotnet test --project tests/OpenCiv2.Base.Tests -c Release --no-build --no-restore
      - name: X02 fixtures and rejection paths
        run: |
          python tools/dotnet/pcg_fixtures.py
          python tools/dotnet/run_conformance.py --report build/test-results/conformance-native.json --adapter dotnet tests/OpenCiv2.ConformanceAdapter/bin/Release/net11.0/OpenCiv2.ConformanceAdapter.dll
          python tools/dotnet/test_conformance.py --adapter dotnet tests/OpenCiv2.ConformanceAdapter/bin/Release/net11.0/OpenCiv2.ConformanceAdapter.dll
          python tests/conformance_script_adapter.py dotnet tests/OpenCiv2.ConformanceAdapter/bin/Release/net11.0/OpenCiv2.ConformanceAdapter.dll
          python tests/conformance_session_adapter.py dotnet tests/OpenCiv2.ConformanceAdapter/bin/Release/net11.0/OpenCiv2.ConformanceAdapter.dll
      - name: Inspection CLI and stored roundtrip integration
        run: |
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=".exe"; fi
          python tests/inspection_cli.py "src/OpenCiv2.Cli/bin/Release/net11.0/oc2$suffix" "tests/OpenCiv2.SaveRoundTrip/bin/Release/net11.0/OpenCiv2.SaveRoundTrip$suffix"
      - name: Preference map and wire helper integration
        run: |
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=".exe"; fi
          python tests/preference_cli.py "tests/OpenCiv2.PreferenceRoundTrip/bin/Release/net11.0/OpenCiv2.PreferenceRoundTrip$suffix"
          python tests/roundtrip_helpers_cli.py "tests/OpenCiv2.MapRoundTrip/bin/Release/net11.0/OpenCiv2.MapRoundTrip$suffix" "tests/OpenCiv2.WireRoundTrip/bin/Release/net11.0/OpenCiv2.WireRoundTrip$suffix"
      - name: Live load edit and save integration
        run: |
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=".exe"; fi
          python tests/live_save_cli.py "tests/OpenCiv2.LiveSave/bin/Release/net11.0/OpenCiv2.LiveSave$suffix"
      - name: Gameplay content CLI integration
        run: |
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=".exe"; fi
          python tests/content_cli.py "src/OpenCiv2.Cli/bin/Release/net11.0/oc2$suffix"
      - name: Content pack CLI integration
        run: |
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=".exe"; fi
          python tests/content_pack_cli.py "src/OpenCiv2.Cli/bin/Release/net11.0/oc2$suffix"
      - name: Rule and city validation and conversion CLI integration
        run: |
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=".exe"; fi
          python tests/rules_cli.py "src/OpenCiv2.Cli/bin/Release/net11.0/oc2$suffix"
      - name: Configure MSVC for optional native libraries
        if: runner.os == 'Windows'
        shell: pwsh
        run: .github/scripts/enable-msvc.ps1
      - name: Build and test optional Lua-CSharp automation
        run: |
          dotnet restore solutions/OpenCiv2.Automation.slnx --locked-mode
          dotnet build solutions/OpenCiv2.Automation.slnx -c Release --no-restore
          dotnet test --project tests/OpenCiv2.Automation.Tests -c Release --no-build --no-restore
          dotnet format solutions/OpenCiv2.Automation.slnx --verify-no-changes --no-restore
          python tools/dotnet/run_automation.py --report build/test-results/lua-native.json --adapter dotnet tests/OpenCiv2.AutomationProbe/bin/Release/net11.0/OpenCiv2.AutomationProbe.dll
          python tools/dotnet/test_automation.py --report build/test-results/lua-native.json
      - name: Build pinned optional SQLite native library
        run: python tools/dotnet/build_sqlite.py
      - run: dotnet restore solutions/OpenCiv2.Sqlite.slnx --locked-mode
      - run: dotnet build solutions/OpenCiv2.Sqlite.slnx -c Release --no-restore
      - run: dotnet test --project tests/OpenCiv2.Sqlite.Tests -c Release --no-build --no-restore
      - name: Independent SQLite export checks
        run: |
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=".exe"; fi
          python tests/sqlite_cli.py "src/OpenCiv2.Cli.Sqlite/bin/Release/net11.0/oc2-sqlite$suffix"
      - name: Cooperative CLI signal cancellation
        if: runner.os == 'Linux'
        run: python tools/dotnet/test_sqlite_signals.py src/OpenCiv2.Cli.Sqlite/bin/Release/net11.0/oc2-sqlite
      - run: dotnet format solutions/OpenCiv2.Sqlite.slnx --verify-no-changes --no-restore
      - run: dotnet format OpenCiv2.slnx --verify-no-changes --no-restore
      - run: python tools/dotnet/check_graph.py
      - name: Build pinned native audio output
        run: python tools/dotnet/build_audio.py
      - name: Build optional production application host
        run: |
          dotnet restore solutions/OpenCiv2.App.slnx --locked-mode
          dotnet build solutions/OpenCiv2.App.slnx -c Release --no-restore
          dotnet publish src/OpenCiv2.Desktop -c Release --no-restore
          dotnet format solutions/OpenCiv2.App.slnx --verify-no-changes --no-restore
      - name: Native application input on isolated X11
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb libxtst6 clang imagemagick
          python tools/dotnet/run_xvfb.py python tools/dotnet/run_application.py --report build/test-results/application-native.json --adapter dotnet src/OpenCiv2.Desktop/bin/Release/net11.0/OpenCiv2.Desktop.dll
      - name: Verify pinned map graphics and exercise Linux renderer
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          content=build/map-ci
          results=build/test-results
          mkdir -p "$content/runtime" "$content/fonts" "$results"
          read -r atlas_url atlas_hash < <(python -c 'import json; p = json.load(open("dependencies.json"))["assets"]; print(p["url"], p["sha256"])')
          read -r fonts_url fonts_hash < <(python -c 'import json; p = json.load(open("dependencies.json"))["libraries"]["DejaVu"]; print(p["url"], p["sha256"])')
          curl -fLsS --retry 3 "$atlas_url" -o "$content/atlas.zip"
          curl -fLsS --retry 3 "$fonts_url" -o "$content/fonts.tar.bz2"
          printf '%s  %s\n' "$atlas_hash" "$content/atlas.zip" "$fonts_hash" "$content/fonts.tar.bz2" | sha256sum --check
          unzip -q "$content/atlas.zip" -d "$content/runtime"
          tar -xf "$content/fonts.tar.bz2" -C "$content/fonts" --strip-components=1
          python -m pip install Pillow==12.1.1
          python tools/dotnet/build_map_art_cases.py "$content/art-cases"
          desktop=src/OpenCiv2.Desktop/bin/Release/net11.0/OpenCiv2.Desktop.dll
          probe=tests/OpenCiv2.MapProbe/bin/Release/net11.0/OpenCiv2.MapProbe.dll
          map_inputs=(--assets "$content/runtime" --fonts "$content/fonts")
          gallery=(python tools/dotnet/run_map_showcase_native.py "${map_inputs[@]}" --art-cases "$content/art-cases")
          dotnet "$probe" "$content/runtime" "$content/fonts" "$results/map-matrix" --matrix "$content/art-cases"
          python tools/dotnet/run_xvfb.py "${gallery[@]}" --expected-density 1 --output "$results/map-gallery-1x" --adapter dotnet "$desktop"
          AVALONIA_GLOBAL_SCALE_FACTOR=2 python tools/dotnet/run_xvfb.py --screen 3000x2100x24 "${gallery[@]}" --interaction-only --expected-density 2 --output "$results/map-gallery-2x" --adapter dotnet "$desktop"
          python tools/dotnet/run_xvfb.py python tools/dotnet/run_application.py --map-assets "$content/runtime" --map-fonts "$content/fonts" --report "$results/application-map-native.json" --adapter dotnet "$desktop"
          python tools/dotnet/run_xvfb.py python tools/dotnet/measure_map_native.py "${map_inputs[@]}" --output "$results/map-recovery" --size 1920x1080 --mode resource-recovery --diagnostic --diagnostic-warmup 0 --diagnostic-frames 3 --adapter dotnet "$desktop"
          dotnet "$probe" "$content/runtime" "$content/fonts" "$results/map-recovery/replay.json" --replay-native-map "$results/map-recovery/native-performance.json"
          python tools/dotnet/run_xvfb.py python tools/dotnet/measure_map_native.py "${map_inputs[@]}" --output "$results/map-cold" --size 1920x1080 --mode cold-first-frame --diagnostic --diagnostic-frames 1 --adapter dotnet "$desktop"
          dotnet "$probe" "$content/runtime" "$content/fonts" "$results/map-cold/replay.json" --replay-native-map "$results/map-cold/native-performance.json"
      - name: Publish opt-in Native AOT desktop
        run: |
          dotnet restore src/OpenCiv2.Desktop -p:Oc2DesktopAot=true --locked-mode
          dotnet publish src/OpenCiv2.Desktop -c Release -p:Oc2DesktopAot=true --no-restore
      - name: Native AOT application input on isolated X11
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          content=build/map-ci
          results=build/test-results
          desktop=src/OpenCiv2.Desktop/bin/Release/net11.0/linux-x64/publish/OpenCiv2.Desktop
          probe=tests/OpenCiv2.MapProbe/bin/Release/net11.0/OpenCiv2.MapProbe.dll
          python tools/dotnet/run_xvfb.py python tools/dotnet/run_application.py --native-aot --map-assets "$content/runtime" --map-fonts "$content/fonts" --report "$results/application-aot.json" --adapter "$desktop"
          python tools/dotnet/run_xvfb.py python tools/dotnet/measure_map_native.py --native-aot --assets "$content/runtime" --fonts "$content/fonts" --output "$results/map-cold-aot" --size 1920x1080 --mode cold-first-frame --diagnostic --diagnostic-frames 1 --adapter "$desktop"
          dotnet "$probe" "$content/runtime" "$content/fonts" "$results/map-cold-aot/replay.json" --replay-native-map "$results/map-cold-aot/native-performance.json"
      - name: Record native results
        run: |
          mkdir -p build/test-results
          dotnet --info > build/test-results/dotnet-info.txt
          dotnet tests/OpenCiv2.FoundationProbe/bin/Release/net11.0/OpenCiv2.FoundationProbe.dll > build/test-results/native.json
          python tools/dotnet/write_identity.py build/test-results/build-identity.json --report build/test-results/native.json
          cp build/sqlite/native/oc2-sqlite-build.json build/test-results/
      - name: Package and exercise self-contained native CLIs
        run: |
          python tools/dotnet/package_cli.py
          python tools/dotnet/package_cli.py --sqlite
          rid=$(python -c 'import sys; sys.path.insert(0, "tools/dotnet"); from package_cli import host_rid; print(host_rid())')
          extension="tar.gz"
          if [[ "$RUNNER_OS" == "Windows" ]]; then extension="zip"; fi
          python tools/dotnet/test_package.py "build/packages/oc2-$rid.$extension" --report build/test-results/package-base.json
          python tools/dotnet/test_package.py "build/packages/oc2-sqlite-$rid.$extension" --report build/test-results/package-sqlite.json
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: cli-packages-${{ matrix.os }}
          path: build/packages/*
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: build/test-results/

  browser:
    name: Browser, Lua and application input
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install matching WASM workload
        run: dotnet workload install wasm-tools --skip-manifest-update
      - run: python tools/dotnet/test_identity.py
      - run: python tools/dotnet/test_publish_notices.py
      - run: dotnet restore tests/OpenCiv2.Browser.Tests --locked-mode
      - run: dotnet publish tests/OpenCiv2.Browser.Tests -c Release --no-restore
      - run: dotnet format tests/OpenCiv2.Browser.Tests/OpenCiv2.Browser.Tests.csproj --verify-no-changes --no-restore
      - run: dotnet restore tests/OpenCiv2.ConformanceBrowser --locked-mode
      - run: dotnet publish tests/OpenCiv2.ConformanceBrowser -c Release --no-restore
      - run: dotnet format tests/OpenCiv2.ConformanceBrowser/OpenCiv2.ConformanceBrowser.csproj --verify-no-changes --no-restore
      - run: dotnet restore tests/OpenCiv2.ConformanceAdapter --locked-mode
      - run: dotnet build tests/OpenCiv2.ConformanceAdapter -c Release --no-restore
      - name: Install pinned browser driver
        run: |
          npm install --prefix build/browser --no-save --package-lock=false playwright@1.58.2
          node build/browser/node_modules/playwright/cli.js install --with-deps chromium
      - name: Build and compare production Lua on native and WASM
        env:
          NODE_PATH: ${{ github.workspace }}/build/browser/node_modules
        run: |
          dotnet restore solutions/OpenCiv2.Automation.slnx --locked-mode
          dotnet build solutions/OpenCiv2.Automation.slnx -c Release --no-restore
          dotnet restore tests/OpenCiv2.AutomationBrowser --locked-mode
          dotnet publish tests/OpenCiv2.AutomationBrowser -c Release --no-restore
          dotnet format tests/OpenCiv2.AutomationBrowser/OpenCiv2.AutomationBrowser.csproj --verify-no-changes --no-restore
          python tools/dotnet/run_automation.py --report build/test-results/lua-native.json --adapter dotnet tests/OpenCiv2.AutomationProbe/bin/Release/net11.0/OpenCiv2.AutomationProbe.dll
          python tools/dotnet/run_automation.py --report build/test-results/lua-browser.json --browser-bundle tests/OpenCiv2.AutomationBrowser/bin/Release/net11.0-browser/publish/wwwroot
          python tools/dotnet/test_automation.py --report build/test-results/lua-native.json
          python tools/dotnet/test_automation.py --report build/test-results/lua-browser.json
          python tools/dotnet/compare_automation.py build/test-results/lua-native.json build/test-results/lua-browser.json
      - name: Build production Avalonia browser host
        run: |
          dotnet restore src/OpenCiv2.Browser --locked-mode
          dotnet publish src/OpenCiv2.Browser -c Release --no-restore
          dotnet format src/OpenCiv2.Browser/OpenCiv2.Browser.csproj --verify-no-changes --no-restore
      - name: Stage pinned browser graphics and fonts
        run: |
          set -euo pipefail
          content=build/map-browser-ci
          mkdir -p "$content/runtime" "$content/fonts"
          read -r atlas_url atlas_hash < <(python -c 'import json; p = json.load(open("dependencies.json"))["assets"]; print(p["url"], p["sha256"])')
          read -r fonts_url fonts_hash < <(python -c 'import json; p = json.load(open("dependencies.json"))["libraries"]["DejaVu"]; print(p["url"], p["sha256"])')
          curl -fLsS --retry 3 "$atlas_url" -o "$content/atlas.zip"
          curl -fLsS --retry 3 "$fonts_url" -o "$content/fonts.tar.bz2"
          printf '%s  %s\n' "$atlas_hash" "$content/atlas.zip" "$fonts_hash" "$content/fonts.tar.bz2" | sha256sum --check
          unzip -q "$content/atlas.zip" -d "$content/runtime"
          tar -xf "$content/fonts.tar.bz2" -C "$content/fonts" --strip-components=1
          python -m pip install Pillow==12.1.1
          python tools/dotnet/build_map_art_cases.py "$content/art-cases"
          python tools/dotnet/stage_browser_content.py --bundle src/OpenCiv2.Browser/bin/Release/net11.0-browser/publish/wwwroot --assets "$content/runtime" --fonts "$content/fonts" --art-cases "$content/art-cases"
      - name: Production browser pointer and keyboard input
        env:
          NODE_PATH: ${{ github.workspace }}/build/browser/node_modules
        run: python tools/dotnet/run_application.py --report build/test-results/application-browser.json --browser-bundle src/OpenCiv2.Browser/bin/Release/net11.0-browser/publish/wwwroot
      - name: Browser file storage, restart and failure handling
        env:
          NODE_PATH: ${{ github.workspace }}/build/browser/node_modules
        run: node tools/dotnet/run_storage_browser.cjs src/OpenCiv2.Browser/bin/Release/net11.0-browser/publish/wwwroot build/test-results/storage-browser.json
      - name: Complete browser map matrix and WebGL gallery
        env:
          NODE_PATH: ${{ github.workspace }}/build/browser/node_modules
        run: |
          dotnet restore tests/OpenCiv2.MapBrowser --locked-mode
          dotnet publish tests/OpenCiv2.MapBrowser -c Release --no-restore
          dotnet format tests/OpenCiv2.MapBrowser/OpenCiv2.MapBrowser.csproj --verify-no-changes --no-restore
          python tools/dotnet/stage_browser_content.py --bundle tests/OpenCiv2.MapBrowser/bin/Release/net11.0-browser/publish/wwwroot --assets build/map-browser-ci/runtime --fonts build/map-browser-ci/fonts --art-cases build/map-browser-ci/art-cases --acceptance
          node tools/dotnet/run_map_browser.cjs tests/OpenCiv2.MapBrowser/bin/Release/net11.0-browser/publish/wwwroot build/test-results/map-browser
          python tools/dotnet/check_browser_map_pixels.py build/test-results/map-browser
      - name: Run real WASM foundation cases
        env:
          NODE_PATH: ${{ github.workspace }}/build/browser/node_modules
        run: node tools/dotnet/run_browser.cjs tests/OpenCiv2.Browser.Tests/bin/Release/net11.0-browser/publish/wwwroot build/test-results/browser.json
      - name: Record workload identity
        if: always()
        run: |
          mkdir -p build/test-results
          dotnet --info > build/test-results/dotnet-info.txt
          dotnet workload list > build/test-results/workloads.txt
          python tools/dotnet/write_identity.py build/test-results/build-identity.json --report build/test-results/browser.json
      - name: Compare native and WASM X02 observations
        env:
          NODE_PATH: ${{ github.workspace }}/build/browser/node_modules
        run: |
          python tools/dotnet/run_conformance.py --report build/test-results/conformance-native.json --adapter dotnet tests/OpenCiv2.ConformanceAdapter/bin/Release/net11.0/OpenCiv2.ConformanceAdapter.dll
          python tools/dotnet/run_conformance.py --report build/test-results/conformance-browser.json --browser-bundle tests/OpenCiv2.ConformanceBrowser/bin/Release/net11.0-browser/publish/wwwroot
          python tools/dotnet/test_conformance.py --browser-bundle tests/OpenCiv2.ConformanceBrowser/bin/Release/net11.0-browser/publish/wwwroot
          python tools/dotnet/compare_conformance.py build/test-results/conformance-native.json build/test-results/conformance-browser.json
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: browser-results
          path: build/test-results/
