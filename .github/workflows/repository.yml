name: Repository checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  metadata:
    name: Specifications and content (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python tools/check_conformance.py
      - run: python tools/check_assets.py
      - name: Install pinned content schema validator
        run: python -m pip install -r tools/requirements-schemas.txt
      - run: python tools/check_content_schemas.py
      - run: python tools/check_gameplay.py
      - name: Test specification and content validators
        run: python -m unittest discover -s tests -p "test_*.py" -v
